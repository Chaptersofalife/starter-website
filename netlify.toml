# Settings Netlify reads when it builds and publishes the website.
[build]
  command = "npm run build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "22"

# Turn on Netlify's Next.js support explicitly, so pages, logins and
# server code are always set up correctly on every deploy.
[[plugins]]
  package = "@netlify/plugin-nextjs"
